<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cloud Storage Full</title>

<style>
:root{
  --purple:#673DE6;
  --bg:#f6f7fb;
  --text:#111827;
  --muted:#6b7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Header */
.header{
  padding:28px 0;
  display:flex;
  justify-content:center;
}

.header img{
  height:230px;
}

/* Main */
.main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:40px 20px;
}

.container{
  max-width:1100px;
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}

/* Text */
.content h1{
  font-size:32px;
  margin-bottom:10px;
}

.content p{
  font-size:15px;
  color:var(--muted);
  max-width:420px;
}

/* Illustration */
.illustration{
  position:relative;
  display:flex;
  justify-content:center;
}

.card{
  width:360px;
  height:260px;
  background:#ffffff;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
  position:relative;
}

/* Purple arc */
.arc{
  position:absolute;
  width:120px;
  height:120px;
  border:16px solid var(--purple);
  border-right-color:transparent;
  border-bottom-color:transparent;
  border-radius:50%;
  top:-30px;
  left:-30px;
}

/* Person placeholder */
.person{
  position:absolute;
  right:-10px;
  bottom:-10px;
  width:140px;
  height:200px;
  background:linear-gradient(#e5e7eb,#d1d5db);
  border-radius:20px 20px 10px 10px;
}

/* Footer text */
.footer{
  padding:20px 0;
  font-size:13px;
  color:var(--muted);
}

/* Responsive */
@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
    text-align:center;
  }
  .content p{
    margin:0 auto;
  }
}
</style>
</head>

<body>

  <!-- Hostinger Logo -->
  <div class="header">
    <img src="hostinger-website-builder_p88r.3840.webp"   width=600px height="600px" alt="Hostinger Logo">
  </div>

  <div class="main">
    <div class="container">

      <!-- Text -->
      <div class="content">
        <h1>Cloud Storage Full</h1>
        <p>
          Your cloud storage has reached its maximum capacity.
          New uploads and updates are temporarily unavailable until
          space is freed or the storage plan is upgraded.
        </p>
      </div>

      <!-- Illustration -->
      <div class="illustration">
        <div class="card">
          <div class="arc"></div>
          <div class="person"></div>
        </div>
      </div>

    </div>
  </div>

  <div class="footer">
    © 2025 · All rights reserved
  </div>

</body>
</html>
