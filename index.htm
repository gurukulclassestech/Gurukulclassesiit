<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gurukul Classes</title>

  <!-- Your existing style sheets -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mediaquries.css" />

  <!-- Add popup and mobile menu CSS here or in your existing CSS files -->
  <style>
    /* Popup CSS */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 10px;
    }
    .popup-box {
      position: relative;
      background: #fff;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      animation: popupScale 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .popup-img {
      width: 100%;
      border-radius: 12px 12px 0 0;
    }
    .popup-close {
      position: absolute;
      top: -12px;
      right: -12px;
      background: #ff0000;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .popup-btn {
      display: block;
      background: #007bff;
      color: white;
      padding: 12px 15px;
      text-align: center;
      font-size: 16px;
      text-decoration: none;
      border-radius: 0 0 12px 12px;
      font-weight: bold;
    }
    .popup-btn:hover {
      background: #0056b3;
    }
    @keyframes popupScale {
      from {transform: scale(0.7); opacity: 0;}
      to {transform: scale(1); opacity: 1;}
    }
    @media (max-width: 480px) {
      .popup-box {
        max-width: 95%;
      }
      .popup-btn {
        font-size: 14px;
        padding: 10px;
      }
    }

    /* Mobile menu toggle button */
    .menu-toggle {
      display: none;
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 28px;
      background: transparent;
      border: none;
      color: black;
      cursor: pointer;
      z-index: 10000;
    }

    /* Responsive nav for mobile */
    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }
      .nav-links {
        position: fixed;
        top: 0;
        right: -250px;
        width: 250px;
        height: 100%;
        background: white;
        transition: right 0.3s ease;
        box-shadow: -2px 0 5px rgba(0,0,0,0.3);
        z-index: 9999;
      }
      .nav-links.open {
        right: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Popup HTML: Always on top overlay -->
  <div id="gurukul-popup-overlay" class="popup-overlay">
    <div class="popup-box">
      <button class="popup-close" onclick="closeGurukulPopup()">×</button>
      <img src="Screenshot (5).png" class="popup-img" alt="G-SAT Popup" />
      <a href="#" class="popup-btn">Click to Register for G-SAT Scholarship Test</a>
    </div>
  </div>

  <section class="header">
    <nav style="position: relative;">
      <a href="#"><img src="gurukul.png" width="220" height="60" alt="Logo" /></a>
      
      <!-- Mobile hamburger menu button -->
      <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle navigation menu">
        &#9776;
      </button>

      <div class="nav-links" id="navLinks">
        <i class="bi bi-x-circle-fill" onclick="toggleMenu()" style="cursor:pointer;position:absolute;top:10px;right:10px;font-size:24px;"></i>
        <ul class="nav-list" id="navList">
          <li><a href="index.htm">Home</a></li>
          <li class="dropdown">
            <a href="#" class="dropbtn">About +</a>
            <ul class="dropdown-content">
              <li><a href="About.htm">About Us</a></li>
              <li><a href="founder.htm">Founder's Message</a></li>
            </ul>
          </li>
          <li class="dropdown">
            <a href="#" class="dropbtn">Course +</a>
            <ul class="dropdown-content">
              <li><a href="engg.htm">Engineer</a></li>
              <li><a href="medical.htm">Medical</a></li>
              <li><a href="carrer.htm">Career Foundation</a></li>
            </ul>
          </li>
          <!-- Add all other menu items as you have -->
          <li><a href="Contact.htm">Contact Us</a></li>
        </ul>
      </div>
    </nav>
  </section>

  <!-- Your existing website content and structure goes here -->

  <!-- JavaScript to handle popup and mobile menu -->
  <script>
    // Popup show/hide
    function showGurukulPopup() {
      document.getElementById("gurukul-popup-overlay").style.display = "flex";
    }
    function closeGurukulPopup() {
      document.getElementById("gurukul-popup-overlay").style.display = "none";
    }
    window.addEventListener('load', () => setTimeout(showGurukulPopup, 1000));

    // Mobile menu toggle
    function toggleMenu() {
      const nav = document.getElementById("navLinks");
      nav.classList.toggle("open");
    }
  </script>

</body>
</html>
