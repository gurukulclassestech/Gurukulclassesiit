<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>503 - Service Unavailable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Retry-After" content="3600">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f2937, #111827);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .box {
            max-width: 500px;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 18px;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ef4444;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="status">Scheduled Maintenance</div>
        <h1>We'll Be Back Soon</h1>
        <p>
            Our website is currently undergoing scheduled maintenance 
            to improve performance and user experience.
            <br><br>
            We appreciate your patience.
        </p>
        <div class="footer">
            © 2026 Hostinger . All Rights Reserved.
        </div>
    </div>
</body>
</html>
